[main]
#include=~/.config/foot/themes/heitor-dark
include=~/.config/foot/themes/heitor-dark-pastel
#include=~/.config/foot/themes/noctalia

font=JetBrainsMono Nerd Font:size=13
#font=JetBrainsMono Nerd Font Mono:size=13
pad=8x8
selection-target=clipboard

[csd]
preferred=none

[scrollback]
lines=20000

[key-bindings]
# Pipe last command's output to nvim in a new footclient window.
# Relies on OSC-133 C/D markers, which fish 4.x emits natively (mark-prompt
# feature) - no fish_preexec/fish_postexec hooks required.
pipe-command-output=[sh -c "f=$(mktemp); cat > $f; footclient nvim -R $f; rm -f $f"] Control+Shift+g

[mouse-bindings]
# Free Shift so Shift+wheel reaches the app (nvim horizontal scroll).
# Terminal-native text selection over a mouse-grabbing TUI moves to Alt+drag.
selection-override-modifiers=Mod1

[text-bindings]
\x1b\x7f=Control+BackSpace

